<!DOCTYPE html>
<html>
  <head>
    <title>Course Passable?</title>
    
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Course Passable?</h1>
    <div class="top-controls">
      <button type="button" id="createAssignmentType">New category</button>
      <span id="totalWeightLabel">Total weight: 0%</span>
      <button type="button" id="clearStorage">clear types</button>
    </div>
    <div id="types">

    </div>
      
    
    <div id="result"></div>
    <table id="assignment">
      <tbody>

      </tbody>
    </table>
    <button type="button" id="newAssignment">New Assignment</button>
    <div id="modalOverlay" style="display: none;">
      <div id = "assignmentModal">
        <h3>New Assignment</h3>
        <label>Assignment Name<input type="text" id="newAssignmentName" placeholder="e.g. Homework 3" maxlength=""></label>
        <label>Total Points <input type="number" id="newAssignmentTotal" placeholder="e.g. 100"></label>
        <label>Earned Points <input type="number" id="newAssignmentEarned" placeholder="e.g. 85"></label>
        <div id="modalButtons">
          <button type="button" id="submitAssignment">Submit</button>
          <button type="button" id="cancelAssignment">Cancel</button>
        </div>
      </div>
    </div>

    <div id="typeModalOverlay" style="display: none;">
      <div id="typeModal">
        <h3>New Category</h3>
        <label>Category Name
          <input type="text" id="assignmentTypeModal" placeholder="e.g. Homework" maxlength="25">
        </label>
        <label>Weight (%)
          <input type="number" id="assignmentWeightModal" placeholder="e.g. 20" min="0" max="100">
        </label>
        <div id="typeModalButtons">
          <button type="button" id="submitAssignmentType">Submit</button>
          <button type="button" id="cancelAssignmentType">Cancel</button>
        </div>
      </div>
    </div>
    
    <h2 id="finalGrade">Current Grade: --%</h2>
    <div class="buttonGroup">
      <button type="button" id="calcGrade">Calculate Grade</button>
      <button type="button" id="saveData">Save</button>
      <button type="button" id="resetToPage">Reset to Page Data</button>
    </div>
    <script src="popup.js"></script>
  </body>
